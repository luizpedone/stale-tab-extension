name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Tests and package checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # No dependencies to install: the tests use node:test and the validator
      # only uses the standard library.
      - name: Unit tests
        run: npm test

      - name: Validate manifest, CSP, icons and store graphics; build the package
        run: npm run validate

      # The zip that passes these checks is the one to upload to the Chrome Web
      # Store, so it is attached to the run rather than rebuilt by hand.
      - uses: actions/upload-artifact@v4
        with:
          name: extension-package
          path: dist/*.zip
          if-no-files-found: error
