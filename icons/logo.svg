  <!-- window body -->
  <rect x="26" y="30" width="76" height="68" rx="13" fill="#f9fafb" />
  <!-- browser chrome, same rounded top corners as the body -->
  <path d="M26 46V43a13 13 0 0 1 13-13h50a13 13 0 0 1 13 13v3z" fill="#334155" />

  <!-- crescent moon: navy disc with a lighter disc bitten out of it -->
