<!doctype html>
<html lang="en" data-theme="system">
  <head>
    <meta charset="utf-8" />
    <title>[Stale] tab</title>
    <link rel="icon" type="image/png" sizes="32x32" href="icons/icon32.png" />
    <link rel="stylesheet" href="theme.css" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
      }
      main {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 24px;
        box-sizing: border-box;
        text-align: center;
      }
      .brand {
        margin: 0 0 2px;
        font-size: 11px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--muted);
      }
      h1 {
        margin: 0;
        max-width: 640px;
        font-size: 20px;
        font-weight: 600;
        overflow-wrap: anywhere;
      }
      p {
        margin: 0;
        max-width: 640px;
        overflow-wrap: anywhere;
      }
      .reason {
        font-size: 13px;
        color: var(--muted);
      }
      .address {
        font-size: 12px;
        color: var(--muted);
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
        margin-top: 8px;
      }
      .tip {
        margin-top: 4px;
        font-size: 12px;
        color: var(--muted);
      }
      button {
        font: inherit;
        font-size: 15px;
        padding: 10px 22px;
        border-radius: 8px;
        cursor: pointer;
        background: var(--primary-bg);
        border: 1px solid var(--primary-bg);
        color: var(--primary-text);
      }
      button.secondary {
        background: transparent;
        border-color: var(--field-border);
        color: var(--text);
        font-size: 14px;
      }
      button:disabled {
        opacity: 0.65;
        cursor: default;
      }
      button[hidden],
      [hidden] {
        display: none;
      }
      button:focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="brand">Stale Tab Curtain</p>
      <h1 id="title">This tab was put to sleep.</h1>
      <p class="reason" id="reason"></p>
      <p class="address" id="address"></p>
      <div class="actions">
        <button type="button" id="reactivate">Reactivate</button>
        <button type="button" class="secondary" id="keep-awake">
          Never sleep this site
        </button>
      </div>
      <p class="tip" id="tip"></p>
    </main>

    <script type="module" src="dormant.js"></script>
  </body>
</html>
